  As mesmas 7 frases da versão 2, sem as pausas de dentro. Mudou em relação à v2:
   - ele aparece no cenário real dele (estante, luz), sem fundo falso; a janela do app flutua atrás da cabeça;
   - mais motions de explicação, sempre montados com pedaços reais da gravação de tela:
       M1 (C1/C2)  o link do REA e o app a clonar entram no Claude Code, e o pedido real é digitado
       M2 (R2)     o que foi clonado (lentes do clone) e o que foi adicionado (gravando, transcrição, resumo)
       M3 (W)      os dois clones; o áudio vira texto
       M4 (V)      recapitulação: REA + pedido -> os dois clones; ele fecha com o nome do repositório
  Texto na tela: o pedido que ele digitou, nomes dos apps, "menos de 1 hora" (fala), rótulos tirados da fala
  (clonado, adicionado, áudio, texto) e o nome/endereço do REA.
-->
